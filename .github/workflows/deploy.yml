name: Deploy to Vertex AI Agent Engine

# ─────────────────────────────────────────────────────────────────────────────
# RUN NAME LOGIC
# This dynamically sets the title of the workflow run in the GitHub Actions UI.
# It prioritizes context in this order:
#   1. New branch creation message.
#   2. Pull Request title (if triggered by a PR).
#   3. Manual deployment label (if triggered by workflow_dispatch).
#   4. Commit message (if triggered by a push).
# ─────────────────────────────────────────────────────────────────────────────
run-name: >-
  ${{
    github.event.created && format('Initial Deploy message for the creation of a new branch of {0}', github.ref_name) ||
    github.event_name == 'pull_request' && github.event.pull_request.title ||
    github.event_name == 'workflow_dispatch' && format('Manual Deploy of {0}', github.ref_name) ||
    github.event.head_commit.message
  }}

on:
  # ───────────────────────────────────────────────────────────────────────────
  # PULL REQUEST TRIGGER (Production Gatekeeping)
  # We trigger on PRs to 'main' so that developers can see if the environment 
  # resolves correctly during the review. However, we SKIP the actual 'deploy' 
  # job for PRs to ensure production is only updated AFTER a merge.
  # ───────────────────────────────────────────────────────────────────────────
  pull_request:
    branches:
      - main       # → Show plan/resolve environment for PROD PRs, but don't deploy yet.
  
  # ───────────────────────────────────────────────────────────────────────────
  # PUSH TRIGGER (Continuous Deployment)
  # 'main': Triggers AFTER a PR is merged, executing the actual production deploy.
  # 'dev/**': Triggers on every push to a development branch for rapid iteration.
  # ───────────────────────────────────────────────────────────────────────────
  push:
    branches:
      - main       # → Final deploy to PROD (after PR merge).
      - 'dev/**'   # → Continuous deploy to DEV.
  
  # Allows manual triggering from the GitHub Actions tab.
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# CONCURRENCY CONTROL (Deduplication)
# This prevents multiple deployments to the SAME agent/branch simultaneously.
# If a new push occurs while an old one is still running, the old one is 
# canceled automatically. We use the 'base_ref' (target branch) or 'ref_name' 
# to ensure PRs and Merges for the same destination are grouped together.
# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: RESOLVE ENVIRONMENT
  # This job acts as a router. It determines which GitHub Environment (and 
  # therefore which GCP project/secrets) we should use based on the branch.
  # ───────────────────────────────────────────────────────────────────────────
  resolve-environment:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    # Allow manual dispatch, PRs, and direct pushes/merges.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push'
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      display_name: ${{ steps.set-env.outputs.display_name }}
      skip_deploy: ${{ steps.set-env.outputs.skip_deploy }}

    steps:
      - name: Determine environment and display name
        id: set-env
        run: |
          # Log context for debugging
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref Name: ${{ github.ref_name }}"
          echo "Base Ref: ${{ github.base_ref }}"
          
          # 1. Identify the 'Target Branch' (the branch we are trying to update)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi

          SKIP_DEPLOY="false"
          
          # 2. Map the Branch to a GitHub Environment
          # 'main' -> PROD environment
          # 'dev/*' -> DEV environment
          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "Target branch is main. Setting target to PROD / Production."
            ENV="PROD"
            DISPLAY_NAME="Production"
          elif echo "$TARGET_BRANCH" | grep -q "^dev/"; then
            echo "Target branch $TARGET_BRANCH starts with 'dev/'. Setting target to DEV / $TARGET_BRANCH."
            ENV="DEV"
            DISPLAY_NAME="$TARGET_BRANCH"
          else
            # Halt if the branch logic isn't defined
            echo "Unsupported target branch: $TARGET_BRANCH. Skipping deployment."
            SKIP_DEPLOY="true"
            ENV="NONE"
            DISPLAY_NAME="NONE"
          fi
          
          # Export variables for use in subsequent jobs
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "display_name=$DISPLAY_NAME" >> "$GITHUB_OUTPUT"
          echo "skip_deploy=$SKIP_DEPLOY" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: DEPLOY AGENT
  # This handles the actual packaging and interaction with Google Cloud.
  # It only runs AFTER Job 1 successfully resolves the environment.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Agent (${{ needs.resolve-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve-environment
    
    # SAFETY GATES:
    # 1. Don't run if 'resolve-environment' flagged a skip (unknown branch).
    # 2. Don't run if the event is a Pull Request (we only want to 'Plan' on PRs, not 'Apply').
    if: needs.resolve-environment.outputs.skip_deploy != 'true' && github.event_name != 'pull_request'
    
    # Load secrets and variables scoped to the resolved environment (PROD or DEV).
    environment: ${{ needs.resolve-environment.outputs.environment }}

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────────────────
      # STEP: GOOGLE CLOUD AUTHENTICATION
      # We use Workload Identity Federation (WIF). This is the best practice 
      # approach as it eliminates the need for long-lived service account keys 
      # (JSON files) stored in GitHub.
      # ───────────────────────────────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ───────────────────────────────────────────────────────────────────────
      # STEP: FIND EXISTING AGENT
      # Before deploying, we check if an agent with this 'display_name' already 
      # exists. If it does, we capture its ID so we can 'Update' it instead of 
      # creating a duplicate. We use the Vertex AI REST API via 'curl' because 
      # it allows for precise filtering by display_name.
      # ───────────────────────────────────────────────────────────────────────
      - name: Get existing Agent Engine ID by Display Name
        id: get-agent-id
        run: |
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          DISPLAY_NAME="${{ needs.resolve-environment.outputs.display_name }}"
          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION }}"
          
          # URL-encode the name to handle characters like '/' safely in the API filter
          ENCODED_DISPLAY_NAME=$(jq -rn --arg x "$DISPLAY_NAME" '$x|@uri')
          
          RESPONSE=$(curl -s -X GET \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://$REGION-aiplatform.googleapis.com/v1beta1/projects/$PROJECT_ID/locations/$REGION/reasoningEngines?filter=display_name%3D%22$ENCODED_DISPLAY_NAME%22")
          
          # Extract the resource name of the first match, if any
          AGENT_ID=$(echo "$RESPONSE" | jq -r '.reasoningEngines[0].name // empty')
          
          if [ -n "$AGENT_ID" ]; then
            echo "Found existing agent: $AGENT_ID"
            echo "EXISTING_AGENT_ID=$AGENT_ID" >> "$GITHUB_ENV"
          else
            echo "No existing agent found. A new one will be created."
          fi

      # ───────────────────────────────────────────────────────────────────────
      # STEP: EXECUTE DEPLOYMENT
      # We use the ADK CLI to package the agent. 
      # AGENT_SOURCE_PATH: A variable allowing users to rename their agent folder.
      # agent_engine_id: If provided, ADK will perform an 'In-Place' replacement.
      # ───────────────────────────────────────────────────────────────────────
      - name: Deploy agent to Agent Engine
        run: |
          if [ -n "${EXISTING_AGENT_ID}" ]; then
            echo "Replacing existing Agent Engine deployment: $EXISTING_AGENT_ID"
            adk deploy agent_engine \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --region="${{ vars.GCP_REGION }}" \
              --display_name="${{ needs.resolve-environment.outputs.display_name }}" \
              --agent_engine_id="$EXISTING_AGENT_ID" \
              "${{ vars.AGENT_SOURCE_PATH || 'my_agent' }}"
          else
            echo "Creating a new Agent Engine deployment"
            adk deploy agent_engine \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --region="${{ vars.GCP_REGION }}" \
              --display_name="${{ needs.resolve-environment.outputs.display_name }}" \
              "${{ vars.AGENT_SOURCE_PATH || 'my_agent' }}"
          fi
