name: Deploy to Vertex AI Agent Engine

# NOTE: PR trigger is temporarily commented out during testing.
#       Uncomment pull_request and remove workflow_dispatch when ready for production.
#
# Production trigger — uncomment when testing is complete:
# on:
#   pull_request:
#     types: [closed]
#     branches:
#       - main       # → PROD
#       - 'dev/**'   # → DEV
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'DEV'
        type: choice
        options:
          - DEV
          - PROD

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Resolve which GitHub Environment (and therefore which secrets/variables)
  # to target based on the PR's base branch.
  # ─────────────────────────────────────────────────────────────────────────
  resolve-environment:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    # Allow both manual dispatch and merged PRs (PR trigger currently commented out).
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      display_name: ${{ steps.set-env.outputs.display_name }}

    steps:
      - name: Determine environment and display name
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: use the selected input directly
            ENV="${{ github.event.inputs.environment }}"
            if [ "$ENV" = "PROD" ]; then
              DISPLAY_NAME="Production"
            else
              DISPLAY_NAME="$ENV"
            fi
          else
            # PR merge: derive from the base branch
            BASE_BRANCH="${{ github.base_ref }}"
            if [ "$BASE_BRANCH" = "main" ]; then
              ENV="PROD"
              DISPLAY_NAME="Production"
            elif echo "$BASE_BRANCH" | grep -q "^dev/"; then
              ENV="DEV"
              DISPLAY_NAME="$BASE_BRANCH"
            else
              echo "Unsupported base branch: $BASE_BRANCH"
              exit 1
            fi
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "display_name=$DISPLAY_NAME" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy the agent using the secrets and variables from the resolved
  # GitHub Environment. Adding a new environment is as simple as:
  #   1. Creating it in GitHub (Settings → Environments)
  #   2. Adding a new branch pattern to the `on.pull_request.branches` list
  #   3. Adding the corresponding mapping in the resolve-environment job above
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Agent (${{ needs.resolve-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve-environment
    environment: ${{ needs.resolve-environment.outputs.environment }}

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity Federation (keyless).
      # Each GitHub Environment has its own GCP_WORKLOAD_IDENTITY_PROVIDER and
      # GCP_SERVICE_ACCOUNT secrets, enabling per-environment GCP isolation.
      # See SECURITY.md for setup instructions.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy agent to Agent Engine
        run: |
          adk deploy agent_engine \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --display_name="${{ needs.resolve-environment.outputs.display_name }}" \
            my_agent
