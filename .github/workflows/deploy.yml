name: Deploy to Vertex AI Agent Engine

# NOTE: PR trigger is temporarily commented out during testing.
#       Uncomment pull_request and remove workflow_dispatch when ready for production.
#
# Production trigger — uncomment when testing is complete:
on:
  pull_request:
    branches:
      - main       # → PROD
      - 'dev/**'   # → DEV
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Resolve which GitHub Environment (and therefore which secrets/variables)
  # to target based on the branch name.
  # ─────────────────────────────────────────────────────────────────────────
  resolve-environment:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    # Allow both manual dispatch and PRs.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      display_name: ${{ steps.set-env.outputs.display_name }}
      skip_deploy: ${{ steps.set-env.outputs.skip_deploy }}

    steps:
      - name: Determine environment and display name
        id: set-env
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref Name: ${{ github.ref_name }}"
          echo "Base Ref: ${{ github.base_ref }}"
          
          # Determine the target branch for evaluation
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
            echo "Processing Pull Request trigger targeting: $TARGET_BRANCH"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
            echo "Processing manual trigger (workflow_dispatch) from: $TARGET_BRANCH"
          fi

          SKIP_DEPLOY="false"
          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "Target branch is main. Setting target to PROD / Production."
            ENV="PROD"
            DISPLAY_NAME="Production"
          elif echo "$TARGET_BRANCH" | grep -q "^dev/"; then
            echo "Target branch $TARGET_BRANCH starts with 'dev/'. Setting target to DEV / $TARGET_BRANCH."
            ENV="DEV"
            DISPLAY_NAME="$TARGET_BRANCH"
          else
            echo "Unsupported target branch: $TARGET_BRANCH. Skipping deployment."
            SKIP_DEPLOY="true"
            ENV="NONE"
            DISPLAY_NAME="NONE"
          fi
          
          echo "Final Resolved Values:"
          echo "  Environment: $ENV"
          echo "  Display Name: $DISPLAY_NAME"
          echo "  Skip Deploy: $SKIP_DEPLOY"
          
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "display_name=$DISPLAY_NAME" >> "$GITHUB_OUTPUT"
          echo "skip_deploy=$SKIP_DEPLOY" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy the agent using the secrets and variables from the resolved
  # GitHub Environment. Adding a new environment is as simple as:
  #   1. Creating it in GitHub (Settings → Environments)
  #   2. Adding a new branch pattern to the `on.pull_request.branches` list
  #   3. Adding the corresponding mapping in the resolve-environment job above
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Agent (${{ needs.resolve-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve-environment
    if: needs.resolve-environment.outputs.skip_deploy != 'true'
    environment: ${{ needs.resolve-environment.outputs.environment }}

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity Federation (keyless).
      # Each GitHub Environment has its own GCP_WORKLOAD_IDENTITY_PROVIDER and
      # GCP_SERVICE_ACCOUNT secrets, enabling per-environment GCP isolation.
      # See SECURITY.md for setup instructions.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get existing Agent Engine ID by Display Name
        id: get-agent-id
        run: |
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          DISPLAY_NAME="${{ needs.resolve-environment.outputs.display_name }}"
          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION }}"
          
          echo "Searching for existing reasoning engine with display name: $DISPLAY_NAME"
          
          # URL-encode the display name (important for names like dev/pirate)
          ENCODED_DISPLAY_NAME=$(jq -rn --arg x "$DISPLAY_NAME" '$x|@uri')
          
          # Query the Vertex AI REST API to list reasoning engines and filter by display name
          RESPONSE=$(curl -s -X GET \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://$REGION-aiplatform.googleapis.com/v1beta1/projects/$PROJECT_ID/locations/$REGION/reasoningEngines?filter=display_name%3D%22$ENCODED_DISPLAY_NAME%22")
          
          # Extract the resource name of the first match, if any
          AGENT_ID=$(echo "$RESPONSE" | jq -r '.reasoningEngines[0].name // empty')
          
          if [ -n "$AGENT_ID" ]; then
            echo "Found existing agent: $AGENT_ID"
            echo "EXISTING_AGENT_ID=$AGENT_ID" >> "$GITHUB_ENV"
          else
            echo "No existing agent found. A new one will be created."
          fi

      - name: Deploy agent to Agent Engine
        run: |
          if [ -n "${EXISTING_AGENT_ID}" ]; then
            echo "Replacing existing Agent Engine deployment: $EXISTING_AGENT_ID"
            adk deploy agent_engine \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --region="${{ vars.GCP_REGION }}" \
              --display_name="${{ needs.resolve-environment.outputs.display_name }}" \
              --agent_engine_id="$EXISTING_AGENT_ID" \
              my_agent
          else
            echo "Creating a new Agent Engine deployment"
            adk deploy agent_engine \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --region="${{ vars.GCP_REGION }}" \
              --display_name="${{ needs.resolve-environment.outputs.display_name }}" \
              my_agent
          fi
