name: Deploy to Vertex AI Agent Engine

# Triggers on a merged PR into main (→ PROD) or any dev/* branch (→ DEV).
# Any other branch is ignored.
on:
  pull_request:
    types: [closed]
    branches:
      - main
      - 'dev/**'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Resolve which GitHub Environment (and therefore which secrets/variables)
  # to target based on the PR's base branch.
  # ─────────────────────────────────────────────────────────────────────────
  resolve-environment:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    # Only proceed for merged PRs — ignore PRs that were simply closed/declined.
    if: github.event.pull_request.merged == true
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      display_name: ${{ steps.set-env.outputs.display_name }}

    steps:
      - name: Determine environment from base branch
        id: set-env
        run: |
          BASE_BRANCH="${{ github.base_ref }}"
          if [ "$BASE_BRANCH" = "main" ]; then
            echo "environment=PROD" >> "$GITHUB_OUTPUT"
            echo "display_name=Production" >> "$GITHUB_OUTPUT"
          elif echo "$BASE_BRANCH" | grep -q "^dev/"; then
            echo "environment=DEV" >> "$GITHUB_OUTPUT"
            echo "display_name=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported base branch: $BASE_BRANCH"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy the agent using the secrets and variables from the resolved
  # GitHub Environment. Adding a new environment is as simple as:
  #   1. Creating it in GitHub (Settings → Environments)
  #   2. Adding a new branch pattern to the `on.pull_request.branches` list
  #   3. Adding the corresponding mapping in the resolve-environment job above
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Agent (${{ needs.resolve-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve-environment
    environment: ${{ needs.resolve-environment.outputs.environment }}

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity Federation (keyless).
      # Each GitHub Environment has its own GCP_WORKLOAD_IDENTITY_PROVIDER and
      # GCP_SERVICE_ACCOUNT secrets, enabling per-environment GCP isolation.
      # See SECURITY.md for setup instructions.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy agent to Agent Engine
        run: |
          adk deploy agent_engine \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --display_name="${{ needs.resolve-environment.outputs.display_name }}" \
            my_agent
